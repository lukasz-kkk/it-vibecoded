<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Italian Notes</title>
    <meta
      name="description"
      content="Prosta, skalowalna strona z notatkami do włoskiego."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Italian Notes</p>
          <h1>Notebook do włoskiego</h1>
        </div>

        <button
          id="themeToggle"
          class="theme-toggle"
          type="button"
          aria-label="Przełącz tryb ciemny"
        >
          <span class="icon" aria-hidden="true">🌙</span>
        </button>
      </header>

      <nav id="mainCategoryBar" class="main-category-bar" aria-label="Główne kategorie materiałów"></nav>
      <nav id="subTabBar" class="tabbar" aria-label="Zakładki z materiałami"></nav>

      <main class="page-content">
        <section id="tabContent" class="tab-panel" aria-live="polite"></section>
      </main>
    </div>

    <script src="data/words/categories.js"></script>
    <script src="app.js"></script>
  </body>
</html>
